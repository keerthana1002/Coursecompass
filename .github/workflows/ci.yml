name: CourseCompass CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt pylint bandit
      - name: Static Analysis (Pylint & Bandit)
        run: |
          pylint backend/app --exit-zero
          bandit -r backend/app
      - name: Run Unit & Integration Tests (>=80% Coverage)
        run: |
          pytest tests/test_coursecompass.py -v --cov=backend/app --cov-fail-under=80
